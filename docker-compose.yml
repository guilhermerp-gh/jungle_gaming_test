services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: wager, POSTGRES_PASSWORD: wager, POSTGRES_DB: wager }
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager"]
      interval: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3
    environment: { SERVICES: sqs }
    ports: ["4566:4566"]
    volumes:
      - ./docker/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wallet-events.fifo"]
      interval: 3s
      retries: 30

  migration:
    build: .
    restart: "no"
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://wager:wager@postgres:5432/wager
    depends_on:
      postgres: { condition: service_healthy }
    command: ["bun", "run", "migration:up"]

  app:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://wager:wager@postgres:5432/wager
      AWS_ENDPOINT_URL: http://localstack:4566
      WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wallet-events.fifo
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
      migration: { condition: service_completed_successfully }
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5

  test:
    build: .
    profiles: ["test"]
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://wager:wager@postgres:5432/wager
      TEST_DATABASE_URL: postgres://wager:wager@postgres:5432/wager
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wallet-events.fifo
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
    command: ["bun", "run", "test:pipeline"]

volumes:
  postgres_data:


